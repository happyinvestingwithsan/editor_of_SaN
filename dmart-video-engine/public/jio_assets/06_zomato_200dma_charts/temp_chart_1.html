    overflow: hidden;
    position: relative;
  }
  .tv-header {
    height: 52px;
    background-color: #131722;
    border-bottom: 1px solid #2A2E39;
    display: flex;
    align-items: center;
    padding: 0 16px;
    font-size: 13px;
    gap: 12px;
  }
  .tv-ticker { font-weight: 800; font-size: 16px; color: #F0F3FA; display: flex; align-items: center; gap: 6px; }
  .tv-badge { background: #2A2E39; color: #9CA3AF; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
  .tv-tf { color: #2962FF; font-weight: 700; font-size: 13px; }
  .tv-ohlc { display: flex; gap: 10px; color: #787B86; font-size: 12px; margin-left: 12px; }
  .val-up { color: #089981; font-weight: 600; }
  .val-down { color: #F23645; font-weight: 600; }
  
  .tv-toolbar {
    position: absolute; top: 52px; left: 0; bottom: 0; width: 48px;
    border-right: 1px solid #2A2E39; display: flex; flex-direction: column;
    align-items: center; padding-top: 14px; gap: 18px; color: #787B86;
  }
  .tv-main {
    position: absolute; top: 52px; left: 48px; right: 80px; bottom: 36px;
    overflow: hidden;
  }
  .tv-price-axis {
    position: absolute; top: 52px; right: 0; bottom: 36px; width: 80px;
    border-left: 1px solid #2A2E39; background: #131722; display: flex;
    flex-direction: column; justify-content: space-between; padding: 24px 8px;
    font-size: 12px; font-family: monospace; color: #787B86; text-align: right;
  }
  .tv-time-axis {
    position: absolute; left: 48px; right: 80px; bottom: 0; height: 36px;
    border-top: 1px solid #2A2E39; background: #131722; display: flex;
    justify-content: space-between; align-items: center; padding: 0 40px;
    font-size: 11px; color: #787B86;
  }
  .grid-h { position: absolute; left: 0; right: 0; border-bottom: 1px dashed rgba(42, 46, 57, 0.7); }
  .grid-v { position: absolute; top: 0; bottom: 0; border-right: 1px dashed rgba(42, 46, 57, 0.7); }
  .watermark {
    position: absolute; top: 45%; left: 45%; transform: translate(-50%, -50%);
    font-size: 90px; font-weight: 900; color: rgba(255, 255, 255, 0.03); letter-spacing: 4px; pointer-events: none;

</style>
