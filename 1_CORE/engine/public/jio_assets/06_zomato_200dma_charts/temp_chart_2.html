<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1920px;
    height: 1080px;
    background-color: #131722;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #D1D4DC;
    overflow: hidden;
    position: relative;
  }
  .tv-header {
    height: 52px;
    background-color: #131722;
    border-bottom: 1px solid #2A2E39;
    display: flex;
    align-items: center;
    padding: 0 20px;
    font-size: 14px;
    gap: 16px;
  }
  .tv-ticker { font-weight: 800; font-size: 18px; color: #F0F3FA; display: flex; align-items: center; gap: 8px; }
  .tv-badge { background: #2A2E39; color: #9CA3AF; font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 700; }
  .tv-tf { color: #2962FF; font-weight: 700; font-size: 14px; }
  .tv-drawdown-badge {
    background: rgba(239, 68, 68, 0.15); border: 1px solid #EF4444; color: #EF4444;
    padding: 4px 12px; border-radius: 6px; font-weight: 800; font-size: 13px;
    display: flex; align-items: center; gap: 6px;
  }
  .tv-ohlc { display: flex; gap: 14px; color: #787B86; font-size: 13px; margin-left: 20px; }
  .val-down { color: #F23645; font-weight: 600; }
  
  .tv-toolbar {
    position: absolute; top: 52px; left: 0; bottom: 0; width: 48px;
    border-right: 1px solid #2A2E39; display: flex; flex-direction: column;
    align-items: center; padding-top: 16px; gap: 20px; color: #787B86;
  }
  .tv-main {
    position: absolute; top: 52px; left: 48px; right: 90px; bottom: 36px;
    overflow: hidden;
  }
  .tv-price-axis {
    position: absolute; top: 52px; right: 0; bottom: 36px; width: 90px;
    border-left: 1px solid #2A2E39; background: #131722; display: flex;
    flex-direction: column; justify-content: space-between; padding: 28px 10px;
    font-size: 13px; font-family: monospace; color: #787B86; text-align: right;
  }
  .tv-time-axis {
    position: absolute; left: 48px; right: 90px; bottom: 0; height: 36px;
    border-top: 1px solid #2A2E39; background: #131722; display: flex;
    justify-content: space-between; align-items: center; padding: 0 60px;
    font-size: 12px; color: #787B86;
  }
  .grid-h { position: absolute; left: 0; right: 0; border-bottom: 1px dashed rgba(42, 46, 57, 0.7); }
  .grid-v { position: absolute; top: 0; bottom: 0; border-right: 1px dashed rgba(42, 46, 57, 0.7); }
  .watermark {
    position: absolute; top: 45%; left: 45%; transform: translate(-50%, -50%);
    font-size: 130px; font-weight: 900; color: rgba(255, 255, 255, 0.03); letter-spacing: 4px; pointer-events: none;
  }
</style>
